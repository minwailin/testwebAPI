name: .NET 10 CI Pipeline

# ဘယ်အချိန်မှာ အလုပ်လုပ်မလဲ? main branch ထဲကို push လုပ်ရင် သို့မဟုတ် PR တင်ရင်
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest # Linux Runner ပေါ်မှာ run မယ်

    steps:
    # 1. GitHub ကနေ ကိုယ့် Code တွေကို ဆွဲယူမယ်
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 2. .NET 10 SDK ကို Runner ပေါ်မှာ တင်မယ်
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' # (သို့မဟုတ် မိမိသုံးထားသည့် နောက်ဆုံး ဗားရှင်း)

    # 3. Nuget Packages တွေကို Cache လုပ်ပြီး Restore လုပ်မယ် (Speed Up Pipeline)
    - name: Restore Dependencies
      run: dotnet restore

    # 4. Code ကို Compile လုပ်မယ်
    - name: Build Application
      run: dotnet build --configuration Release --no-restore

    # 5. Unit Test တွေရှိရင် တစ်ခါတည်း Run မယ်
    - name: Run Automated Tests
      run: dotnet test --no-build --verbosity normal